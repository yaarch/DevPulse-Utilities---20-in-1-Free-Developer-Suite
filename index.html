    <!-- Prevent third-party browser extensions (e.g. MetaMask, Web3 injected scripts) from triggering unhandled errors -->
    <script>
      (function() {
        var isExtensionError = function(msg) {
          if (!msg) return false;
          var s = String(msg).toLowerCase();
          return s.indexOf('metamask') !== -1 ||
                 s.indexOf('ethereum') !== -1 ||
                 s.indexOf('failed to connect to metamask') !== -1 ||
                 s.indexOf('evm') !== -1 ||
                 s.indexOf('web3') !== -1;
        };
        window.addEventListener('unhandledrejection', function(event) {
          var reason = (event && event.reason && (event.reason.message || event.reason.stack)) || String(event && event.reason);
          if (isExtensionError(reason)) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') event.stopImmediatePropagation();
            return true;
          }
        }, true);
        window.addEventListener('error', function(event) {
          var message = (event && event.message) || '';
          if (isExtensionError(message)) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('devpulse_theme');
          var isDark = saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
